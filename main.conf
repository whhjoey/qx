# ===============================================================
#  Quantumult X 主配置模板（GitHub 远程托管版）
#  用法：把本仓库文件推到 GitHub 公开仓库，再用下面的 raw / jsdelivr
#  链接在 QX 里「设置 → 配置 → 新建 → 从 URL 导入」。
#  需替换的占位：YOUR_NAME / YOUR_REPO / main(分支名)
# ===============================================================

# ---------- 资源加速：jsdelivr 镜像（国内更稳） ----------
# 格式：https://cdn.jsdelivr.net/gh/YOUR_NAME/YOUR_REPO@main/文件名
# 备用 raw：https://raw.githubusercontent.com/YOUR_NAME/YOUR_REPO/main/文件名

# ============================ [general] ============================
# 基础项按需填写；下面仅放占位说明，不自带任何代理节点。
# network-detail-url = http://ip-api.com/json
# skip-proxy-lan = true

# ============================= [dns] ===============================
# 公共 DNS 按需配置；示例仅作占位。
# [dns]
# enable-ipv6 = false
# nameserver = 119.29.29.29, 223.5.5.5

# ====================== [server_remote] 节点订阅 ====================
# ⚠️ 此处仅留结构。请只填写你有权使用的正规订阅；
#    本模板不附带、也不建议托管任何违规节点资源。
# [server_remote]
# https://你的正规订阅链接, tag=subscription, update-interval=86400, opt-parser=true, enabled=true

# ==================== [policy] 策略组（按需自建） ===================
# 策略组引用你自己的节点；本模板不预置地区/解锁分组。
# [policy]
# proxy = 自动测速, select, 你的节点分组
# direct = 直连, direct

# ====================== [rule_remote] 分流规则 ======================
# 远程拉取自己仓库里的规则列表 rule.list
[rule_remote]
https://cdn.jsdelivr.net/gh/YOUR_NAME/YOUR_REPO@main/rule.list, tag=myRule, update-interval=86400, enabled=true

# ==================== [rewrite_remote] 重写规则 =====================
# 远程拉取自己仓库里的 rewrite.list（内含 Readify 凭证捕获脚本引用）
[rewrite_remote]
https://cdn.jsdelivr.net/gh/YOUR_NAME/YOUR_REPO@main/rewrite.list, tag=myRewrite, update-interval=86400, enabled=true

# ===================== [task_remote] 定时脚本 ======================
# Readify AI 签到脚本，每天 09:00 运行；脚本本体放在自己仓库
[task_remote]
0 9 * * * https://cdn.jsdelivr.net/gh/YOUR_NAME/YOUR_REPO@main/readify_checkin.js, tag=悦读AI签到, update-interval=43200, enabled=true

# ============================ [mitm] ===============================
# 仅在确有抓包需要时开启；CA 证书需安装并在系统设置中完全信任。
# [mitm]
# enable = false
# hostname = *.example.com
# ca-passphrase = 你的证书密码
